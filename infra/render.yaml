# Render blueprint template for Copycat live dashboard.
# The dashboard polls every 1 second. The collector runs continuously and
# immediately starts the next 50-wallet collection when the previous one ends.
services:
  - type: web
    name: hwt-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: PUBLIC_SITE_URL
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: COLLECTOR_FRESHNESS_SECONDS
        value: "180"
      - key: WALLET_DISCOVERY_PROVIDER
        value: "owned_first"

  - type: web
    name: hwt-frontend
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: .
    envVars:
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: NEXT_PUBLIC_API_BASE_URL
        sync: false

  - type: worker
    name: hwt-collector-live-10s
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    dockerCommand: "python -m app.jobs.collect_loop_local"
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: COLLECTOR_INTERVAL_SECONDS
        value: "1"
      - key: COLLECTOR_MAX_WORKERS
        value: "30"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false

  - type: worker
    name: hwt-live-events
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    dockerCommand: "python -m app.jobs.live_wallet_events"
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: LIVE_EVENT_WALLET_LIMIT
        value: "50"
      - key: LIVE_EVENT_SUBSCRIBE_ORDER_UPDATES
        value: "false"
      - key: LIVE_STATE_WALLET_LIMIT
        value: "50"
      - key: LIVE_STATE_POLL_SECONDS
        value: "5"
      - key: LIVE_STATE_MAX_WORKERS
        value: "10"
      - key: LIVE_STATE_MAX_AGE_SECONDS
        value: "45"
      - key: LIVE_SIGNAL_MIN_COVERAGE_RATIO
        value: "0.8"

  - type: worker
    name: hwt-owned-wallet-scanner
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    dockerCommand: "python -m app.jobs.owned_wallet_scanner"
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: WALLET_DISCOVERY_PROVIDER
        value: "owned"
      - key: OWNED_SCANNER_BATCH_SIZE
        value: "250"
      - key: OWNED_SCANNER_MAX_SECONDS
        value: "900"
      - key: OWNED_SCANNER_SLEEP_SECONDS
        value: "3600"
      - key: OWNED_TOP_CLAIM_MIN_INDEXED_WALLETS
        value: "10000"
      - key: OWNED_DISCOVERY_FETCH_FILLS
        value: "false"

  - type: cron
    name: hwt-daily-refresh-midnight
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    schedule: "0 0 * * *"
    dockerCommand: "python -m app.jobs.owned_wallet_refresh"
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: WALLET_DISCOVERY_PROVIDER
        value: "owned"
      - key: OWNED_DISCOVERY_REFRESH_LIMIT
        value: "500"
      - key: OWNED_REFRESH_LIMIT
        value: "75"
      - key: OWNED_REFRESH_MAX_SECONDS
        value: "600"
      - key: OWNED_REFRESH_RUN_COLLECTION
        value: "false"
      - key: OWNED_DISCOVERY_FETCH_FILLS
        value: "false"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false

  - type: cron
    name: hwt-backtest-weekly
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    schedule: "0 2 * * 0"
    dockerCommand: "python -m app.jobs.owned_backtest_from_history"
    envVars:
      - key: DATABASE_URL
        sync: false

  - type: worker
    name: hwt-market-universe
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    dockerCommand: "python -m app.jobs.market_universe_refresh"
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: MARKET_UNIVERSE_SLEEP_SECONDS
        value: "60"


  - type: worker
    name: hwt-historical-fill-backfill
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    dockerCommand: "python -m app.jobs.historical_fill_backfill"
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: OWNED_BACKFILL_WALLET_LIMIT
        value: "25"
      - key: OWNED_BACKFILL_DAYS
        value: "365"
      - key: OWNED_BACKFILL_MAX_PAGES_PER_WALLET
        value: "5"
      - key: OWNED_BACKFILL_MAX_SECONDS
        value: "900"
      - key: OWNED_BACKFILL_SLEEP_SECONDS
        value: "3600"
      - key: OWNED_DISCOVERY_FETCH_FILLS
        value: "false"

