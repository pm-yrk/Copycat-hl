name: Record wallet positioning history
on:
  schedule:
    # R2 history is written by the Windows publisher every five minutes.
    # This lower-frequency, off-peak GitHub archive is the independent fallback;
    # frequent */5 schedules were being coalesced into multi-hour gaps.
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/record_position_history.py
      - .github/workflows/record-position-history.yml
permissions:
  contents: write
concurrency:
  group: copycat-position-history
  cancel-in-progress: false
jobs:
  record:
    if: github.event_name != 'schedule' || github.repository == 'pm-yrk/Copycat-hl'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Archive the public dashboard snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/record_position_history.py
      - name: Establish the first interval on setup
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sleep 65
          python3 scripts/record_position_history.py
